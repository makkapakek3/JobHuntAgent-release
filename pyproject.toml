[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunt-agent"
version = "1.0.0"
description = "Local, approval-gated job discovery with LangGraph"
requires-python = ">=3.12"
dependencies = ["langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3.1.2,<4", "pydantic>=2.7,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]
uia = ["pywinauto>=0.6.9,<0.7; sys_platform == 'win32'"]

[project.scripts]
jobhunt = "jobhunt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
