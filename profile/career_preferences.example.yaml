# 复制为 career_preferences.yaml 后修改；以下仅为候选初值，不是你的最终选择。
schema_version: 1
job_titles:
  - Agent 开发工程师
  - 大模型应用开发工程师
  - Python AI 开发工程师
locations:
  preferred: []                  # 例如：上海、杭州
  acceptable: []                 # 例如：苏州、南京
  excluded: []
compensation:
  expected_monthly_cny: null     # 示例：10000；如果不确定就不填
  minimum_monthly_cny: null
  salary_undisclosed_policy: review  # review / exclude / include
job_type: campus_recruiting
expected_graduation_year: 2027
industries_preferred: []
industries_excluded: []
company_blacklist: []
keywords_must_have: []
keywords_exclude: []
min_match_score_for_review: 75
max_new_jobs_per_run: 50
timezone: Asia/Shanghai           # 按你的实际时区修改
# 调度在 config/settings.yaml 的 schedule_timezone / nightly_time 配置。
